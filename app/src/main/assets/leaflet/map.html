<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            background-color: #EBF2EB;
        }
        #map {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #EBF2EB;
        }
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }
        .user-marker {
            width: 22px;
            height: 22px;
            background: #1E5336;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 5px rgba(30, 83, 54, 0.35);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(30, 83, 54, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(30, 83, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(30, 83, 54, 0); }
        }
        .wasteco-pin-container {
            display: inline-block;
        }
        .wasteco-pin {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #FFFFFF;
            border: 2px solid #1E5336;
            color: #1E5336;
            padding: 5px 10px;
            border-radius: 18px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 3px 6px rgba(0,0,0,0.22);
            white-space: nowrap;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, color 0.2s;
        }
        .wasteco-pin.selected {
            background: #1E5336;
            color: #FFFFFF;
            border-color: #143B26;
            box-shadow: 0 6px 14px rgba(30,83,54,0.45);
            transform: scale(1.1);
            z-index: 9999 !important;
        }
        .wasteco-badge {
            background: #E8F5E9;
            color: #1E5336;
            padding: 1px 5px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 800;
        }
        .wasteco-pin.selected .wasteco-badge {
            background: #2E7D32;
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="leaflet.js"></script>
    <script>
        var map = null;
        var markers = {};
        var currentSelectedId = null;
        var userMarker = null;

        function initMap(userLat, userLng) {
            if (map) return;
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([userLat, userLng], 15);
            window.map = map;

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            var userIcon = L.divIcon({
                className: 'user-marker-icon',
                html: '<div class="user-marker"></div>',
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });
            userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map);

            setTimeout(function() { if (map) map.invalidateSize(); }, 150);
            setTimeout(function() { if (map) map.invalidateSize(); }, 500);
        }

        function setDonations(pins) {
            if (!map) return;
            Object.keys(markers).forEach(function(k) {
                map.removeLayer(markers[k]);
            });
            markers = {};

            pins.forEach(function(pin) {
                var html = '<div class="wasteco-pin-container" id="pin-' + pin.id + '">' +
                    '<div class="wasteco-pin">' +
                    '<span>' + pin.title + '</span>' +
                    '<span class="wasteco-badge">' + pin.itemsCount + ' item</span>' +
                    '</div>' +
                    '</div>';

                var icon = L.divIcon({
                    className: 'wasteco-custom-marker',
                    html: html,
                    iconSize: [120, 32],
                    iconAnchor: [60, 16]
                });

                var m = L.marker([pin.lat, pin.lng], { icon: icon }).addTo(map);
                markers[pin.id] = m;

                m.on('click', function() {
                    highlightMarker(pin.id);
                    if (window.AndroidWasteCo) {
                        window.AndroidWasteCo.onPinClicked(pin.id);
                    }
                });
            });

            if (currentSelectedId) {
                highlightMarker(currentSelectedId);
            }
        }

        function highlightMarker(id) {
            if (!map) return;
            if (currentSelectedId && markers[currentSelectedId]) {
                var prev = document.getElementById('pin-' + currentSelectedId);
                if (prev) {
                    var box = prev.querySelector('.wasteco-pin');
                    if (box) box.classList.remove('selected');
                }
            }
            currentSelectedId = id;
            if (id && markers[id]) {
                var cur = document.getElementById('pin-' + id);
                if (cur) {
                    var box = cur.querySelector('.wasteco-pin');
                    if (box) box.classList.add('selected');
                }
                map.panTo(markers[id].getLatLng(), { animate: true, duration: 0.5 });
            }
        }

        function zoomInMap() { if (map) map.zoomIn(); }
        function zoomOutMap() { if (map) map.zoomOut(); }
        function centerUser(lat, lng) { if (map) map.setView([lat, lng], 15); }

        window.initMap = initMap;
        window.setDonations = setDonations;
        window.highlightMarker = highlightMarker;
        window.zoomInMap = zoomInMap;
        window.zoomOutMap = zoomOutMap;
        window.centerUser = centerUser;

        window.addEventListener('DOMContentLoaded', function() {
            initMap(-7.9535, 112.608);
        });
    </script>
</body>
</html>
