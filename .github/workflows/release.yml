name: Release APK

# Push tag vMAJOR.MINOR.PATCH (mis. v1.2.0) untuk membuat GitHub Release berisi APK bertanda tangan.
# Landing page mengunduh dari releases/latest/download/wasteco.apk, jadi nama aset harus tetap.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag yang sudah ada untuk dibuild ulang (mis. v1.2.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Derive version from tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag harus berformat vMAJOR.MINOR.PATCH (minor/patch < 100), dapat '$TAG'"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WASTECO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret WASTECO_KEYSTORE_BASE64 belum diisi. Lihat README bagian Rilis APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "WASTECO_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0

      - name: Test & assemble release APK
        run: >-
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain
          -Pwasteco.versionName=${{ steps.version.outputs.name }}
          -Pwasteco.versionCode=${{ steps.version.outputs.code }}
        env:
          WASTECO_API_KEY: ${{ secrets.WASTECO_API_KEY }}
          WASTECO_KEYSTORE_PASSWORD: ${{ secrets.WASTECO_KEYSTORE_PASSWORD }}
          WASTECO_KEY_ALIAS: ${{ secrets.WASTECO_KEY_ALIAS }}
          WASTECO_KEY_PASSWORD: ${{ secrets.WASTECO_KEY_PASSWORD }}

      - name: Verify signature & package
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/wasteco.apk
          (cd dist && sha256sum wasteco.apk > wasteco.apk.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/wasteco.apk dist/wasteco.apk.sha256 --clobber
          else
            gh release create "$TAG" dist/wasteco.apk dist/wasteco.apk.sha256 \
              --title "WasteCo ${{ steps.version.outputs.name }}" \
              --generate-notes --verify-tag --latest
          fi

      # Opsional: minta repo landing page build ulang supaya versi & changelog langsung ter-update.
      - name: Notify landing page
        env:
          GH_TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
          LANDING_REPO: ${{ vars.LANDING_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$LANDING_REPO" ]; then
            echo "LANDING_DISPATCH_TOKEN atau LANDING_REPO tidak diset, dilewati."
            exit 0
          fi
          gh api "repos/$LANDING_REPO/dispatches" -f event_type=wasteco-release -f "client_payload[tag]=$TAG"
