name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0

      - uses: gradle/actions/setup-gradle@v5

      - name: Compile, test, assemble debug APK
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --console=plain
        env:
          # Kosong untuk PR dari fork; build tetap jalan, hanya request ke backend yang gagal.
          WASTECO_API_KEY: ${{ secrets.WASTECO_API_KEY }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: wasteco-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 7
